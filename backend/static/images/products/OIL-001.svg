<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="oilBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="pouchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="100" height="100" rx="16" fill="url(#oilBg)"/>
  <!-- Dalda Cooking Oil Pouch -->
  <path d="M 32 24 L 68 24 L 72 82 L 28 82 Z" rx="4" fill="url(#pouchGradient)" stroke="#dc2626" stroke-width="2"/>
  <!-- Red Brand Header Band -->
  <path d="M 31 32 L 69 32 L 70 46 L 30 46 Z" fill="#dc2626"/>
  <text x="50" y="42" font-size="9" font-family="Arial, sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">DALDA</text>
  <!-- Golden Sunflower Drop -->
  <circle cx="50" cy="58" r="8" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
  <path d="M 50 51 C 46 56 46 62 50 64 C 54 62 54 56 50 51 Z" fill="#ea580c"/>
  <!-- Pouch Details -->
  <text x="50" y="74" font-size="7" font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">1 LITRE</text>
  <!-- Critical Stockout Badge -->
  <circle cx="82" cy="18" r="9" fill="#e11d48"/>
  <text x="82" y="22" font-size="10" font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
</svg>
