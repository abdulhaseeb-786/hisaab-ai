<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ledgerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="100" height="100" rx="16" fill="url(#ledgerBg)"/>
  <!-- Open Ledger Book -->
  <path d="M 22 30 Q 50 34 50 40 L 50 78 Q 22 72 22 30 Z" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <path d="M 78 30 Q 50 34 50 40 L 50 78 Q 78 72 78 30 Z" fill="#f8fafc" stroke="#10b981" stroke-width="1.5"/>
  <path d="M 18 28 Q 50 33 50 39 L 50 79 Q 18 73 18 28 Z" fill="url(#bookCover)"/>
  <!-- Ledger Entries Lines -->
  <line x1="26" y1="44" x2="44" y2="47" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="52" x2="42" y2="55" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="60" x2="44" y2="63" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="47" x2="72" y2="44" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="55" x2="70" y2="52" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="63" x2="72" y2="60" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <!-- Floating Gold Coins (Udhaar / Wasooli) -->
  <circle cx="28" cy="24" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <text x="28" y="27" font-size="8" font-family="sans-serif" font-weight="bold" fill="#78350f" text-anchor="middle">₨</text>
  <circle cx="72" cy="24" r="7" fill="#34d399" stroke="#059669" stroke-width="1.5"/>
  <path d="M 69 24 L 71 26 L 75 22" fill="none" stroke="#064e3b" stroke-width="1.5" stroke-linecap="round"/>
</svg>
