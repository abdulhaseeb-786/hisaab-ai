<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Outer ambient ring -->
  <circle cx="60" cy="60" r="44" stroke="#34d399" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 4" />

  <!-- Stylized Kiryana Store Awning / Canopy Roof (The Retail Soul) -->
  <path d="M30 46 L60 30 L90 46 L82 52 L60 41 L38 52 Z" fill="url(#emeraldGrad)" opacity="0.9" />

  <!-- Stylized Financial Growth Bars / Abacus Calculation Columns (The Hisaab Soul) -->
  <!-- Bar 1 (Left - Foundation) -->
  <rect x="36" y="58" width="11" height="32" rx="5.5" fill="#10b981" fill-opacity="0.7" />
  
  <!-- Bar 2 (Middle - Growth) -->
  <rect x="54" y="48" width="12" height="42" rx="6" fill="url(#emeraldGrad)" />

  <!-- Bar 3 (Right - Peak with Sparkle Node) -->
  <rect x="73" y="38" width="11" height="52" rx="5.5" fill="#34d399" />

  <!-- Dynamic Connecting Surge Trendline (Financial Decision Path) -->
  <path d="M41 68 Q58 56 78 42" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95" />

  <!-- AI Intelligence Star / Sparkle Node at the Apex -->
  <circle cx="78.5" cy="42" r="5" fill="url(#goldGrad)" />
  <path d="M78.5 33 L80 40 L87 41.5 L80 43 L78.5 50 L77 43 L70 41.5 L77 40 Z" fill="#ffffff" />
  
  <!-- Subtle Rupee Currency Accent Line -->
  <path d="M38 78 H82" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3" />
</svg>
